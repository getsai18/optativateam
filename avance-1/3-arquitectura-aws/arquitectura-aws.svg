<text x="865" y="578.5" font-size="11" fill="#4b5563">acceso a DynamoDB</text>
<rect x="845" y="160" width="155" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="845" y="160" width="7" height="70" rx="3" fill="#ED7100"/>
<text x="865" y="192.0" font-size="15" font-weight="bold" fill="#111827">EC2 (bastion)</text>
<text x="865" y="211.0" font-size="11" fill="#4b5563">para administrar RDS</text>
<rect x="1085" y="525" width="170" height="75" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="1085" y="525" width="7" height="75" rx="3" fill="#3B48CC"/>
<text x="1105" y="559.5" font-size="15" font-weight="bold" fill="#111827">DynamoDB</text>
<text x="1105" y="578.5" font-size="11" fill="#4b5563">auditoría y sesiones</text>
