<text x="626" y="112" font-size="14" fill="#8C4FFF" text-anchor="start" font-weight="bold">VPC</text>
<text x="660" y="112" font-size="11" fill="#6b7280" text-anchor="start">(red privada en AWS)</text>
<rect x="630" y="130" width="390" height="130" rx="8" fill="#eef7ea" stroke="#7AA116" stroke-width="1.5"/>
<text x="644" y="150" font-size="12" fill="#4d6b0d" text-anchor="start" font-weight="bold">Subnet pública</text>
<rect x="630" y="285" width="390" height="345" rx="8" fill="#e8f1fb" stroke="#3B48CC" stroke-width="1.5"/>
