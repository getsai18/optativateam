<rect x="205" y="300" width="7" height="70" rx="3" fill="#8C4FFF"/>
<text x="225" y="332.0" font-size="15" font-weight="bold" fill="#111827">Route 53</text>
<text x="225" y="351.0" font-size="11" fill="#4b5563">DNS del dominio</text>
<rect x="400" y="95" width="175" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
