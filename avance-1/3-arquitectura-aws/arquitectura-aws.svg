<text x="420" y="351.0" font-size="11" fill="#4b5563">REST API + JWT</text>
<rect x="400" y="520" width="175" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="400" y="520" width="7" height="70" rx="3" fill="#E7157B"/>
