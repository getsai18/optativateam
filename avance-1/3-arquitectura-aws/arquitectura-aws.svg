<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="770" viewBox="0 0 1280 770" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="1280" height="770" fill="#ffffff"/>
<text x="30" y="40" font-size="22" fill="#111827" text-anchor="start" font-weight="bold">Arquitectura AWS - Sistema de Facturación</text>
<text x="30" y="62" font-size="13" fill="#4b5563" text-anchor="start">Frontend (Web) → API Gateway → Lambda (Flask) → RDS / DynamoDB</text>
