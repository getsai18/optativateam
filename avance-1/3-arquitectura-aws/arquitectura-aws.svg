<path d="M575,545 L690,420" fill="none" stroke="#E7157B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="715" y="188" font-size="11" fill="#6b7280" text-anchor="start">SSH</text>
<text x="930" y="277" font-size="11" fill="#6b7280" text-anchor="start">SQL (admin)</text>
<circle cx="182" cy="312" r="12" fill="#111827"/>
<text x="182" y="317" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<circle cx="270" cy="215" r="12" fill="#111827"/>
<text x="270" y="220" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<circle cx="368" cy="312" r="12" fill="#111827"/>
<text x="368" y="317" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<circle cx="592" cy="358" r="12" fill="#111827"/>
<text x="592" y="363" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<circle cx="825" cy="360" r="12" fill="#111827"/>
<text x="825" y="365" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<circle cx="1062" cy="538" r="12" fill="#111827"/>
<text x="1062" y="543" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
<line x1="30" y1="680" x2="1250" y2="680" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="30" y="706" font-size="12" fill="#111827" text-anchor="start">1  El usuario abre el dominio y Route 53 lo resuelve.</text>
<text x="30" y="728" font-size="12" fill="#111827" text-anchor="start">2  El navegador descarga el frontend web desde S3.</text>
<text x="30" y="750" font-size="12" fill="#111827" text-anchor="start">3  El frontend llama a la API y manda su token JWT.</text>
<text x="560" y="706" font-size="12" fill="#111827" text-anchor="start">4  API Gateway invoca la Lambda con el backend Flask.</text>
<text x="560" y="728" font-size="12" fill="#111827" text-anchor="start">5  Lambda consulta y escribe en RDS (tablas y Stored Procedures).</text>
<text x="560" y="750" font-size="12" fill="#111827" text-anchor="start">6  Lambda guarda auditoría, sesiones y carritos en DynamoDB.</text>
</svg>