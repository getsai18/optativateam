service: billing-api
frameworkVersion: '3'

plugins:
  - serverless-wsgi
  - serverless-python-requirements

provider:
  name: aws
  runtime: python3.12
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  httpApi:
    cors: true
  environment:
    DB_ENGINE: ${env:DB_ENGINE, 'mysql'}
    DB_HOST: ${env:DB_HOST, ''}
    DB_PORT: ${env:DB_PORT, '3306'}
    DB_NAME: ${env:DB_NAME, 'billing_db'}
    DB_USER: ${env:DB_USER, ''}
    DB_PASSWORD: ${env:DB_PASSWORD, ''}
    DB_SERVICE_NAME: ${env:DB_SERVICE_NAME, ''}
    JWT_SECRET: ${env:JWT_SECRET, ''}
    SESSION_TTL_MS: ${env:SESSION_TTL_MS, '1800000'}
    DEMO_PASSWORD: ${env:DEMO_PASSWORD, 'demo1234'}
    AUDIT_BACKEND: ${env:AUDIT_BACKEND, 'dynamodb'}
    AUDIT_TABLE: ${env:AUDIT_TABLE, 'billing_audit_log'}
    AUDIT_REQUIRED: ${env:AUDIT_REQUIRED, 'false'}
    CORS_ORIGINS: ${env:CORS_ORIGINS, '*'}

custom:
  wsgi:
    app: wsgi.app
  pythonRequirements:
    dockerizePip: non-linux

functions:
  api:
    handler: wsgi.handler
    events:
      - httpApi: '*'
