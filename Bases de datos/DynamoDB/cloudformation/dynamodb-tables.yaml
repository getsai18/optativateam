AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Sistema de Facturación — Tablas Amazon DynamoDB (NoSQL).
  Crea las 4 tablas del modelo NoSQL: audit_log, invoice_event,
  user_session y invoice_cart. Todo PAY_PER_REQUEST (sin capacidad
  aprovisionada) para no generar costos fijos.

Parameters:
  ProjectTag:
    Type: String
    Default: billing-system
    Description: Etiqueta project usada en todos los recursos.

Resources:
  # ---------------------------------------------------------------------------
  # 1. audit_log — auditoría inmutable (writeAudit del frontend en cada mutación).
  #    PK entity_key (ej. INVOICE#inv_1) + SK event_ts (ISO 8601).
  #    GSI user_id-event_ts: actividad por usuario.
  #    GSI feed_pk-event_ts: feed global ordenado (AuditPage lista por timestamp).
  # ---------------------------------------------------------------------------
  AuditLogTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: billing_audit_log
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: entity_key
          AttributeType: S
        - AttributeName: event_ts
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: feed_pk
          AttributeType: S
      KeySchema:
        - AttributeName: entity_key
          KeyType: HASH
        - AttributeName: event_ts
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: user_id-event_ts-index
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: event_ts
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: feed_pk-event_ts-index
          KeySchema:
            - AttributeName: feed_pk
              KeyType: HASH
            - AttributeName: event_ts
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: project
          Value: !Ref ProjectTag
        - Key: component
          Value: audit

  # ---------------------------------------------------------------------------
  # 2. invoice_event — historial de cambios de estado de cada factura.
  #    PK invoice_id + SK event_ts. Consulta: Query por factura (historial).
  # ---------------------------------------------------------------------------
  InvoiceEventTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: billing_invoice_event
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: invoice_id
          AttributeType: S
        - AttributeName: event_ts
          AttributeType: S
      KeySchema:
        - AttributeName: invoice_id
          KeyType: HASH
        - AttributeName: event_ts
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: project
          Value: !Ref ProjectTag
        - Key: component
          Value: invoice-lifecycle

  # ---------------------------------------------------------------------------
  # 3. user_session — sesión/JWT activo por usuario. TTL en `ttl` (epoch seg).
  #    PK session_id (el token referencia la sesión en cada request).
  #    GSI user_id-index para listar/revocar todas las sesiones de un usuario.
  # ---------------------------------------------------------------------------
  UserSessionTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: billing_user_session
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: user_id-index
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: project
          Value: !Ref ProjectTag
        - Key: component
          Value: auth

  # ---------------------------------------------------------------------------
  # 4. invoice_cart — carrito/borrador del wizard de nueva factura (builderStore).
  #    PK user_id (un carrito por usuario). TTL en `ttl` (epoch seg).
  # ---------------------------------------------------------------------------
  InvoiceCartTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: billing_invoice_cart
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: project
          Value: !Ref ProjectTag
        - Key: component
          Value: invoice-builder

Outputs:
  AuditLogTableName:
    Description: Nombre de la tabla de auditoría
    Value: !Ref AuditLogTable
  InvoiceEventTableName:
    Description: Nombre de la tabla de eventos de factura
    Value: !Ref InvoiceEventTable
  UserSessionTableName:
    Description: Nombre de la tabla de sesiones de usuario
    Value: !Ref UserSessionTable
  InvoiceCartTableName:
    Description: Nombre de la tabla de carritos de factura
    Value: !Ref InvoiceCartTable
