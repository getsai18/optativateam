AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Sistema de Facturacion (Proyecto C) - cuenta de aplicacion en AWS Academy Learner Lab.
  S3 (frontend) -> API Gateway HTTP API (+ Lambda authorizer) -> Lambdas -> RDS (otra cuenta) + DynamoDB.
  Todas las funciones usan el rol preconfigurado LabRole (no se crean roles IAM).

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedPattern: '[a-z0-9-]+'
  LabRoleName:
    Type: String
    Default: LabRole
  BillingDbHost:
    Type: String
  BillingDbPort:
    Type: String
    Default: '3306'
  BillingDbName:
    Type: String
  BillingDbUser:
    Type: String
  BillingDbPassword:
    Type: String
    NoEcho: true
  CatalogDbHost:
    Type: String
  CatalogDbPort:
    Type: String
    Default: '5432'
  CatalogDbName:
    Type: String
  CatalogDbUser:
    Type: String
  CatalogDbPassword:
    Type: String
    NoEcho: true
  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 32
  SessionTtlMs:
    Type: String
    Default: '1800000'
  AllowDemoLogin:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  DemoPassword:
    Type: String
    NoEcho: true
    Default: demo1234

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    Timeout: 20
    MemorySize: 128
    Tags:
      project: billing-system
      stage: !Ref Stage

Resources:
  # ---------------------------------------------------------------------------
  # Frontend: sitio estatico en S3 (SPA: index.html tambien como documento de error)
  # ---------------------------------------------------------------------------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub billing-frontend-${AWS::AccountId}-${Stage}
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: project
          Value: billing-system

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadWebsite
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*

  # ---------------------------------------------------------------------------
  # DynamoDB (On-Demand): auditoria, eventos de factura, sesiones y carritos
  # ---------------------------------------------------------------------------
  AuditLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub billing_audit_log_${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: entity_key, AttributeType: S }
        - { AttributeName: event_ts, AttributeType: S }
        - { AttributeName: user_id, AttributeType: S }
        - { AttributeName: feed_pk, AttributeType: S }
      KeySchema:
        - { AttributeName: entity_key, KeyType: HASH }
        - { AttributeName: event_ts, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: user_id-event_ts-index
          KeySchema:
            - { AttributeName: user_id, KeyType: HASH }
            - { AttributeName: event_ts, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: feed_pk-event_ts-index
          KeySchema:
            - { AttributeName: feed_pk, KeyType: HASH }
            - { AttributeName: event_ts, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      Tags:
        - { Key: project, Value: billing-system }

  InvoiceEventTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub billing_invoice_event_${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: invoice_id, AttributeType: S }
        - { AttributeName: event_ts, AttributeType: S }
      KeySchema:
        - { AttributeName: invoice_id, KeyType: HASH }
        - { AttributeName: event_ts, KeyType: RANGE }
      Tags:
        - { Key: project, Value: billing-system }

  UserSessionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub billing_user_session_${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: session_id, AttributeType: S }
        - { AttributeName: user_id, AttributeType: S }
      KeySchema:
        - { AttributeName: session_id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: user_id-index
          KeySchema:
            - { AttributeName: user_id, KeyType: HASH }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - { Key: project, Value: billing-system }

  InvoiceCartTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub billing_invoice_cart_${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: user_id, AttributeType: S }
      KeySchema:
        - { AttributeName: user_id, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - { Key: project, Value: billing-system }

  # ---------------------------------------------------------------------------
  # API Gateway HTTP API con Lambda authorizer (JWT HS256, payload 1.0 => 401)
  # ---------------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - !Sub http://billing-frontend-${AWS::AccountId}-${Stage}.s3-website-${AWS::Region}.amazonaws.com
          - http://localhost:5173
        AllowHeaders: [Content-Type, Authorization]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25
      Auth:
        DefaultAuthorizer: JwtAuthorizer
        Authorizers:
          JwtAuthorizer:
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            AuthorizerPayloadFormatVersion: '1.0'
            EnableSimpleResponses: false
            Identity:
              Headers: [Authorization]
              ReauthorizeEvery: 300

  # ---------------------------------------------------------------------------
  # Lambdas
  # ---------------------------------------------------------------------------
  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LabRoleName}
      FunctionName: !Sub billing-authorizer-${Stage}
      CodeUri: ../.build/authorizer
      Handler: handler.handler
      Timeout: 5
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret

  # SAM no crea este permiso para authorizers de HTTP API: sin el, API Gateway responde 500.
  AuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt AuthorizerFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/authorizers/*

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LabRoleName}
      FunctionName: !Sub billing-api-${Stage}
      CodeUri: ../.build/api
      Handler: wsgi.handler
      MemorySize: 256
      Environment:
        Variables:
          BILLING_DB_ENGINE: mysql
          BILLING_DB_HOST: !Ref BillingDbHost
          BILLING_DB_PORT: !Ref BillingDbPort
          BILLING_DB_NAME: !Ref BillingDbName
          BILLING_DB_USER: !Ref BillingDbUser
          BILLING_DB_PASSWORD: !Ref BillingDbPassword
          CATALOG_DB_ENGINE: postgres
          CATALOG_DB_HOST: !Ref CatalogDbHost
          CATALOG_DB_PORT: !Ref CatalogDbPort
          CATALOG_DB_NAME: !Ref CatalogDbName
          CATALOG_DB_USER: !Ref CatalogDbUser
          CATALOG_DB_PASSWORD: !Ref CatalogDbPassword
          JWT_SECRET: !Ref JwtSecret
          SESSION_TTL_MS: !Ref SessionTtlMs
          ALLOW_DEMO_LOGIN: !Ref AllowDemoLogin
          DEMO_PASSWORD: !Ref DemoPassword
          AUDIT_BACKEND: dynamodb
          AUDIT_TABLE: !Ref AuditLogTable
          AUDIT_REQUIRED: 'false'
          CORS_ORIGINS: !Sub http://billing-frontend-${AWS::AccountId}-${Stage}.s3-website-${AWS::Region}.amazonaws.com,http://localhost:5173
      Events:
        Login:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /auth/login
            Auth:
              Authorizer: NONE
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /health
            Auth:
              Authorizer: NONE
        Default:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: ANY
            Path: /{proxy+}

  CartFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LabRoleName}
      FunctionName: !Sub billing-cart-${Stage}
      CodeUri: ../.build/cart
      Handler: handler.handler
      Environment:
        Variables:
          CART_TABLE: !Ref InvoiceCartTable
          CART_TTL_DAYS: '7'
          CORS_ORIGIN: !Sub http://billing-frontend-${AWS::AccountId}-${Stage}.s3-website-${AWS::Region}.amazonaws.com
      Events:
        Cart:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: ANY
            Path: /cart

  TaxRateSyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LabRoleName}
      FunctionName: !Sub billing-tax-rate-sync-${Stage}
      CodeUri: ../.build/tax_rate_sync
      Handler: handler.handler
      Environment:
        Variables:
          CATALOG_DB_HOST: !Ref CatalogDbHost
          CATALOG_DB_PORT: !Ref CatalogDbPort
          CATALOG_DB_NAME: !Ref CatalogDbName
          CATALOG_DB_USER: !Ref CatalogDbUser
          CATALOG_DB_PASSWORD: !Ref CatalogDbPassword
      Events:
        Daily:
          Type: Schedule
          Properties:
            Name: !Sub billing-tax-rate-sync-${Stage}
            Description: Activa las tasas de impuesto programadas (sp_sync_tax_rates)
            Schedule: cron(5 0 * * ? *)

  # Retencion corta de logs para no consumir credito
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/billing-api-${Stage}
      RetentionInDays: 7
  AuthorizerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/billing-authorizer-${Stage}
      RetentionInDays: 7
  CartLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/billing-cart-${Stage}
      RetentionInDays: 7
  TaxRateSyncLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/billing-tax-rate-sync-${Stage}
      RetentionInDays: 7

Outputs:
  ApiUrl:
    Description: URL base de la API (VITE_API_URL)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  FrontendUrl:
    Description: URL del sitio
    Value: !GetAtt FrontendBucket.WebsiteURL
  FrontendBucketName:
    Value: !Ref FrontendBucket
  AuditTable:
    Value: !Ref AuditLogTable
  CartTable:
    Value: !Ref InvoiceCartTable
